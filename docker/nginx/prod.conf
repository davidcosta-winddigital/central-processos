server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 64M;
    charset utf-8;

    location ^~ /api/          { try_files $uri /index.php?$query_string; }
    location ^~ /sanctum/      { try_files $uri /index.php?$query_string; }
    location ^~ /broadcasting/ { try_files $uri /index.php?$query_string; }

    location ^~ /storage/ {
        root /var/www/html/public;
        try_files $uri /index.php?$query_string;
    }

    location / {
        root /srv/static;
        try_files $uri $uri/ /index.html;

        location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
            root /srv/static;
            expires 30d;
            access_log off;
            add_header Cache-Control "public, max-age=2592000, immutable";
            try_files $uri =404;
        }
    }

    location ~ \.php$ {
        root /var/www/html/public;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTPS                  $http_x_forwarded_proto if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_FOR   $http_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_read_timeout 120s;
    }

    location ~ /\.(?!well-known).* { deny all; }
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
